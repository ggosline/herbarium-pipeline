name: Build prebaked pod image

# Builds the RunPod environment image (Dockerfile) and pushes it to GHCR.
# Nobody builds Docker locally — this is the only builder. Rebuilds trigger
# only when the dependency surface changes (lockfile / manifest / Dockerfile),
# so ordinary code edits don't burn CI minutes.
#
# After the FIRST successful run, make the package public once:
#   GitHub → repo → Packages → herbarium-pipeline → Package settings →
#   Change visibility → Public.
# Then RunPod pulls it anonymously — no registry token needed.

on:
  push:
    branches: [main, docker-prebaked-image]
    paths:
      - pyproject.toml
      - uv.lock
      - Dockerfile
      - .github/workflows/build-image.yml
  workflow_dispatch: {}   # manual "Run workflow" button

concurrency:
  group: build-image-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}   # ggosline/herbarium-pipeline

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write        # push to GHCR with the built-in GITHUB_TOKEN
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # :latest tracks the default branch; :sha-<short> pins every build so
          # the orchestrator can be nailed to an exact image when debugging.
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=ref,event=branch

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # zstd layers instead of the default gzip: zstd decompresses much
          # faster, so the pod's image-extract phase (a chunk of the ~7.5 min
          # cold start) shrinks. force-compression recompresses the base layers
          # too (they arrive gzip'd) to maximise the win. RISK: RunPod's
          # containerd must accept the zstd layer media type — modern ones do,
          # but this is exactly what the branch pod-test validates before it
          # ever reaches :latest. `outputs` replaces `push: true`.
          outputs: type=image,push=true,compression=zstd,force-compression=true
          # GitHub Actions layer cache — makes rebuilds after a small lock bump
          # reuse the apt/uv base layers instead of rebuilding from scratch.
          cache-from: type=gha
          cache-to: type=gha,mode=max
