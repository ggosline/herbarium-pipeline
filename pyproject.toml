[project]
name = "herbarium-pipeline"
version = "0.1.0"
description = "Herbarium image classification pipeline — download, filter, crop, resize, train, identify."
readme = "README.md"
requires-python = ">=3.12,<3.14"

dependencies = [
    # Core ML
    "torch>=2.3",
    "torchvision>=0.18",
    "pytorch-lightning>=2.2",
    "torchmetrics>=1.3",
    "timm>=1.0",
    "transformers>=4.40",  # CLIP for filter_and_crop

    # Data / numerics
    "numpy>=1.26",
    "pandas>=2.2",
    "scikit-learn>=1.4",

    # Image I/O
    "pillow>=10.0",
    "opencv-python-headless>=4.9",

    # Experiment tracking
    "wandb>=0.16",

    # CLI / progress
    "tqdm>=4.66",

    # Web UI
    "nicegui>=2.0",

    # Cloud orchestration (RunPod REST + SSH/SFTP for pod control).
    # Pulled in for the cloud/ subpackage; harmless on local-only setups.
    "httpx>=0.27",
    "paramiko>=3.4",
    "keyring>=24",
]

[project.optional-dependencies]
# DALI is installed separately because the wheel name depends on the
# target CUDA version (e.g. nvidia-dali-cuda120). See pod_bootstrap.sh.
# Kept here as a hint, not a hard dep.
dali = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
include = [
    "*.py",
]

[tool.uv]
# Consider every configured index when resolving each package, instead of
# stopping at the first index that has *any* version of that package.
# Without this, uv finds e.g. torchmetrics 1.0.3 on pytorch.org/whl/cu128
# and refuses to look at PyPI for the newer 1.x we actually need.
# The "unsafe" name guards against dependency-confusion attacks where a
# malicious internal index publishes a fake "django" wheel — irrelevant
# here because pytorch.org is the trusted upstream for those wheels.
index-strategy = "unsafe-best-match"

# PyTorch's own CDN (CloudFront) reliably serves at 50–100 MB/s into
# RunPod, while PyPI/Fastly has been observed at <3 Mbps from EUR-IS-1,
# turning a 90-second torch install into a 90-minute one. Pin Linux
# torch + torchvision to the cu128 index; macOS keeps the PyPI wheels
# (MPS / CPU). Other platforms fall back to PyPI as well.
#
# cu128 was chosen so the locked torch version matches what the project
# was already tested against (2.11.x). cu121 / cu124 cap at older
# versions. Bump to cu130 (or whatever's current) when you upgrade
# torch in the future.
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
# explicit=true (its previous value) limits the index to packages that
# are explicitly source-mapped to it. With only torch + torchvision
# mapped, uv resolved torch's transitive deps (nvidia-cublas-cu12,
# nvidia-cudnn-cu12, etc., ~3 GB total) from PyPI/Fastly — which is the
# slow path we're trying to avoid. Leaving explicit unset (the default)
# lets uv prefer this index for any package it carries, so the whole
# CUDA stack comes through pytorch.org's CDN.

[tool.uv.sources]
torch       = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux'" }]
